import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform
import org.gradle.nativeplatform.platform.internal.DefaultOperatingSystem

plugins {
    id "java-library"
    id "maven-publish"
    id "signing"
}

group = 'org.astroEngine'
version = 'a0.1v'

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

String lwjglVersion = "3.3.3"
DefaultOperatingSystem os = DefaultNativePlatform.currentOperatingSystem;
String natives =
        os.isLinux() ? "linux" :
                os.isMacOsX() ? "macos" :
                        os.isWindows() ? "windows" :
                                null;

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    implementation "org.lwjgl:lwjgl:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-glfw:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-opengl:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-openal:$lwjglVersion"

    implementation "org.lwjgl:lwjgl-stb:$lwjglVersion"
    runtimeOnly "org.lwjgl:lwjgl-stb:$lwjglVersion:natives-$natives"

    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-$natives"
    runtimeOnly "org.lwjgl:lwjgl-glfw:$lwjglVersion:natives-$natives"
    runtimeOnly "org.lwjgl:lwjgl-opengl:$lwjglVersion:natives-$natives"
    runtimeOnly "org.lwjgl:lwjgl-openal:$lwjglVersion:natives-$natives"

    implementation 'org.joml:joml:1.10.8'
    implementation 'org.jdom:jdom2:2.0.6.1'

    implementation "io.github.spair:imgui-java-binding:1.86.11"
    implementation "io.github.spair:imgui-java-lwjgl3:1.86.11"

    implementation(platform("org.lwjgl:lwjgl-bom:$lwjglVersion"))
    implementation "org.lwjgl:lwjgl-assimp:$lwjglVersion"
    runtimeOnly "org.lwjgl:lwjgl-assimp:$lwjglVersion:natives-$natives"

    runtimeOnly "io.github.spair:imgui-java-natives-$natives:1.86.11"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api libs.commons.math3

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(26))
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
